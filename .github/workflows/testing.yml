name: Testing

on:
  push:
    branches:
      - master
    # Release tags run the suite as a pre-release check; nothing is published.
    tags:
      - '[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+*'
  pull_request:
  workflow_dispatch:

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.3', '8.2', '8.1', '8.0', '7.4']
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_tests
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer, phpunit-polyfills:1.1, wp-cli
          coverage: none

      - name: Install Subversion (needed by the WordPress test suite installer)
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Validate composer.json
        run: composer validate --no-check-publish --no-check-lock

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_tests root root 127.0.0.1 latest true

      - name: Run tests
        run: phpunit --testdox

  javascript:
    name: JavaScript tests (node:test)
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # node --test needs 21+ to expand the tests/js/*.test.js glob itself.
          node-version: '22'

      # The js-admin build-freshness test needs webpack and ts-loader to rebuild
      # assets/js-admin from assets/js-admin-src.
      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm run test:js

  lint:
    name: PHP syntax check (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '7.4']

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint PHP files
        run: |
          find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -print0 | xargs -0 -n1 -P4 php -l > /dev/null
